name: telnd_mobile
description: TELND - Career & Talent Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  
  # Networking
  dio: ^5.4.0
  dio_smart_retry: ^6.0.0
  
  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.0
  
  # Routing
  go_router: ^14.0.0
  
  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  
  # Utils
  intl: ^0.20.3
  url_launcher: ^6.2.0
  package_info_plus: ^10.2.1
  
  # Location
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  
  # File Handling
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0
  mocktail: ^1.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/ads/
